name: OHMS Cloud Autonomous Remote Dispatch (24/7 Cloud Execution)

on:
  repository_dispatch:
    types: [telegram-command, cloud-dispatch]
  workflow_dispatch:
    inputs:
      action:
        description: 'Task to execute in cloud'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - test
          - typecheck
          - deploy
          - health
      chat_id:
        description: 'Telegram Chat ID to notify'
        required: false
        default: '1161469999'

permissions:
  contents: write
  pages: write
  actions: read

jobs:
  cloud-execution:
    name: Autonomous Cloud Execution Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript Typecheck
        if: ${{ github.event.inputs.action == 'all' || github.event.inputs.action == 'typecheck' || github.event.client_payload.action == 'typecheck' }}
        run: npx tsc --noEmit

      - name: Run Test Certification Matrix
        if: ${{ github.event.inputs.action == 'all' || github.event.inputs.action == 'test' || github.event.client_payload.action == 'test' }}
        run: npm test

      - name: Cloudflare Build & Verify
        if: ${{ github.event.inputs.action == 'all' || github.event.inputs.action == 'deploy' || github.event.client_payload.action == 'deploy' }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: ${{ github.event.inputs.action == 'all' || github.event.inputs.action == 'deploy' || github.event.client_payload.action == 'deploy' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=onnesha-hospital --commit-dirty=true
        continue-on-error: true

      - name: Notify Telegram of Cloud Completion
        if: always()
        run: |
          CHAT_ID="${{ github.event.inputs.chat_id || github.event.client_payload.chat_id || '1161469999' }}"
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            MSG="☁️ <b>24/7 Cloud Autonomous Run PASSED!</b>%0A%0A• <b>Execution Node:</b> GitHub Actions Cloud Runner (PC Off Mode)%0A• <b>Job Status:</b> ✅ SUCCESS%0A• <b>Commit:</b> <code>${{ github.sha }}</code>%0A• <b>Live Website:</b> https://onnesha-hospital.pages.dev%0A%0A<i>System verified and active 24/7 without requiring local workstation power.</i>"
          else
            MSG="⚠️ <b>24/7 Cloud Autonomous Run Alert</b>%0A%0A• <b>Execution Node:</b> GitHub Actions Cloud Runner%0A• <b>Status:</b> ❌ $STATUS%0A• <b>Commit:</b> <code>${{ github.sha }}</code>"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN || '8435645496:AAHl0iZaJx8v1hVLeaJ9ifXZufJErS2VqBw' }}/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$MSG" \
            -d "parse_mode=HTML"
