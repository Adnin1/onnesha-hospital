name: OHMS Manual Multi-Target Deployment (Supplementary — Primary CI is ci.yml)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment Target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cloudflare-pages
          - docker-image
          - tauri-desktop

# Top-level least privilege: Read-only access by default
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Full Release Certification Pre-flight Gate (Strictly Aligned with Mandatory CI)
  preflight-gate:
    name: Full Release Pre-Flight Verification Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Verification
        run: npm run typecheck

      - name: Zero-Warning ESLint Gate
        run: npx eslint . --max-warnings 0

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Next.js Production Static Export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: "https://onnesha-hospital.pages.dev"
        run: npm run build

      - name: Static Link and Asset Crawl
        run: npm run audit:assets

      - name: Automated Unit & Invariants Test Suite
        run: npm run test:certification

      - name: Automated Project Governance Health Check
        run: node scripts/project-health-check.mjs

  # 2. Dedicated Staging Live Security Gate (Parity with CI Gate)
  live-security-test:
    name: Dedicated Staging Live Security Gate
    runs-on: ubuntu-latest
    needs: preflight-gate
    environment: staging
    permissions:
      contents: read
    env:
      OHMS_TEST_SUPABASE_URL: ${{ secrets.OHMS_TEST_SUPABASE_URL }}
      OHMS_TEST_SERVICE_ROLE_KEY: ${{ secrets.OHMS_TEST_SECRET_KEY || secrets.OHMS_TEST_SERVICE_ROLE_KEY }}
      OHMS_TEST_PUBLISHABLE_KEY: ${{ secrets.OHMS_TEST_PUBLISHABLE_KEY || secrets.OHMS_TEST_ANON_KEY }}
    steps:
      - name: Fail-Closed Check for Required Staging Secrets
        if: env.OHMS_TEST_SUPABASE_URL == '' || env.OHMS_TEST_SERVICE_ROLE_KEY == ''
        run: |
          echo "::error title=Staging Gate Blocked::OHMS_TEST_SUPABASE_URL and OHMS_TEST_SERVICE_ROLE_KEY are required for staging security certification. Fail-closed gate triggered. Production deployment is strictly BLOCKED until real isolated staging credentials are configured in GitHub secrets."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Authenticated Cross-Tenant Live Suite
        env:
          RUN_LIVE_SUPABASE_TESTS: "true"
        run: node --test tests/live/authenticated-cross-tenant.live.test.mjs

  # 3. Cloudflare Pages Production Edge Release
  deploy-cloudflare:
    name: Cloudflare Pages Edge Deployment
    needs: [preflight-gate, live-security-test]
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'cloudflare-pages'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Next.js Static Export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: "https://onnesha-hospital.pages.dev"
        run: npm run build

      - name: Deploy to Cloudflare Pages (Exact Commit Provenance)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy out --project-name=onnesha-hospital --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false

  # 4. Docker Container Verification Build (Local verification - push disabled)
  build-container:
    name: Docker Container Verification Build
    needs: [preflight-gate, live-security-test]
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'docker-image'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image (Fail-closed: No fake production fallbacks)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: onnesha-hospital:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=https://onnesha-hospital.pages.dev
