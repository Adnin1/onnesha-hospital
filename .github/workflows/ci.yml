name: OHMS CI Quality, Security & Desktop Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://iuhtzahuszdkdarhxobx.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_OPiG-7uhoIlnysXKrpErsw_rdXEJ4rs' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create CI environment file
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://iuhtzahuszdkdarhxobx.supabase.co' }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_OPiG-7uhoIlnysXKrpErsw_rdXEJ4rs' }}" >> .env.local

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: ESLint zero-warning gate
        run: npx eslint . --max-warnings 0

      - name: Node unit & integration test suite
        run: npm test

      - name: Next.js static production export
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright E2E tests
        run: npm run test:e2e

  tauri-windows-build:
    name: Tauri Windows Desktop Build
    runs-on: windows-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Next.js static production export
        run: npm run build

      - name: Build Tauri Desktop Executable
        run: npx tauri build --no-bundle

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-desktop
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/
          if-no-files-found: warn
