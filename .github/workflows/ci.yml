name: OHMS CI Quality, Security & Desktop Pipeline

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Mandatory CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mock-ci-project.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_mock_ci_anon_key_for_hermetic_build' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create CI environment file
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mock-ci-project.supabase.co' }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_mock_ci_anon_key_for_hermetic_build' }}" >> .env.local

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: ESLint zero-warning gate
        run: npx eslint . --max-warnings 0

      - name: Security audit for high/critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Next.js static production export
        run: npm run build

      - name: Forensic static link and asset crawl
        run: npm run audit:assets

      - name: Node test suite (Strict Certification Gate)
        run: npm run test:certification

      - name: Install Playwright browsers (Four-Browser Engine Matrix)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright E2E tests (Chromium, Firefox, Mobile Chrome, WebKit)
        run: npx playwright test --project=chromium --project=firefox --project=mobile-chrome --project=webkit

  live-security-test:
    name: Dedicated Staging Live Security Gate
    runs-on: ubuntu-latest
    needs: validate
    environment: staging
    permissions:
      contents: read
    env:
      OHMS_TEST_SUPABASE_URL: ${{ secrets.OHMS_TEST_SUPABASE_URL }}
      OHMS_TEST_SERVICE_ROLE_KEY: ${{ secrets.OHMS_TEST_SECRET_KEY || secrets.OHMS_TEST_SERVICE_ROLE_KEY }}
      OHMS_TEST_PUBLISHABLE_KEY: ${{ secrets.OHMS_TEST_PUBLISHABLE_KEY || secrets.OHMS_TEST_ANON_KEY }}
    steps:
      - name: Fail-Closed Check for Required Staging Secrets
        if: env.OHMS_TEST_SUPABASE_URL == '' || env.OHMS_TEST_SERVICE_ROLE_KEY == ''
        run: |
          echo "::error title=Staging Gate Blocked::OHMS_TEST_SUPABASE_URL and OHMS_TEST_SERVICE_ROLE_KEY (or OHMS_TEST_SECRET_KEY) are required for staging security certification. Fail-closed gate triggered."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Authenticated Cross-Tenant Live Suite
        env:
          RUN_LIVE_SUPABASE_TESTS: "true"
        run: node --test tests/live/authenticated-cross-tenant.live.test.mjs

  deploy-production:
    name: Deploy to Cloudflare Pages (Production Gate)
    runs-on: ubuntu-latest
    needs: [validate, live-security-test]
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Fail-Closed Check for Production Secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.NEXT_PUBLIC_SUPABASE_URL == '' || env.NEXT_PUBLIC_SUPABASE_ANON_KEY == ''
        run: |
          echo "::error title=Deployment Gate Blocked::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, NEXT_PUBLIC_SUPABASE_URL, and NEXT_PUBLIC_SUPABASE_ANON_KEY are required for production deployment. Automatic CI production deployment blocked fail-closed."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Production Environment File
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" >> .env.local

      - name: Next.js static production export
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=onnesha-hospital --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false

      - name: Post-Deployment Edge Smoke Verification
        run: |
          echo "Running post-deploy edge verification against https://onnesha-hospital.pages.dev..."
          curl -f -s -S -I "https://onnesha-hospital.pages.dev" | grep -i "server: cloudflare"
          curl -f -s -S -I "https://onnesha-hospital.pages.dev/doctors" | grep -i "200"
          curl -f -s -S -I "https://onnesha-hospital.pages.dev/check-token" | grep -i "200"
          echo "Edge smoke test passed."

  tauri-windows-build:
    name: Tauri Windows Desktop Build & Release
    runs-on: windows-latest
    needs: [validate, live-security-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Fail-Closed Check for Desktop Production Secrets
        shell: powershell
        run: |
          if (-not $env:NEXT_PUBLIC_SUPABASE_URL -or -not $env:NEXT_PUBLIC_SUPABASE_ANON_KEY) {
            Write-Error "CRITICAL: Desktop release requires real NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY in GitHub secrets. Mock build prohibited for release binaries."
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Create Desktop Environment File
        shell: powershell
        run: |
          "NEXT_PUBLIC_SUPABASE_URL=$env:NEXT_PUBLIC_SUPABASE_URL" | Out-File -FilePath .env.local -Encoding utf8 -Append
          "NEXT_PUBLIC_SUPABASE_ANON_KEY=$env:NEXT_PUBLIC_SUPABASE_ANON_KEY" | Out-File -FilePath .env.local -Encoding utf8 -Append
          "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$env:NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" | Out-File -FilePath .env.local -Encoding utf8 -Append

      - name: Next.js static production export
        run: npm run build

      - name: Install WiX Toolset & NSIS
        shell: powershell
        run: |
          choco install wixtoolset nsis --allow-downgrade --no-progress
          $wixPath = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
          if ($wixPath) {
            Write-Host "Adding $wixPath\bin to GITHUB_PATH"
            "$wixPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            "WIX=$wixPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build Tauri Desktop Executable and Installer Bundles
        run: npx tauri build --ci

      - name: Validate Generated Desktop and Installer Artifacts
        shell: powershell
        run: |
          $exe = Get-Item "src-tauri/target/release/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi = Get-Item "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsis = Get-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $exe -or $exe.Length -eq 0) {
            Write-Error "CRITICAL: Release executable is missing or zero bytes!"
            exit 1
          }
          if (-not $msi -or $msi.Length -eq 0) {
            Write-Error "CRITICAL: MSI installer bundle is missing or zero bytes!"
            exit 1
          }
          if (-not $nsis -or $nsis.Length -eq 0) {
            Write-Error "CRITICAL: NSIS setup installer bundle is missing or zero bytes!"
            exit 1
          }

          Write-Host "Artifact Validation Passed:"
          Write-Host "  • Desktop Executable: $($exe.Name) ($($exe.Length) bytes)"
          Write-Host "  • MSI Installer:      $($msi.Name) ($($msi.Length) bytes)"
          Write-Host "  • NSIS Setup:         $($nsis.Name) ($($nsis.Length) bytes)"

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-desktop
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/
          if-no-files-found: error

      - name: Determine and Validate Release Version Provenance
        shell: powershell
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Write-Host "package.json version: $ver"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVer = $env:GITHUB_REF -replace '^refs/tags/v', ''
            if ($tagVer -ne $ver) {
              Write-Error "CRITICAL: Git tag version ($tagVer) does not match package.json version ($ver)!"
              exit 1
            }
            Write-Host "Tag version matches package.json: v$ver"
          }
          "OHMS_RELEASE_TAG=v$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OHMS_RELEASE_NAME=Onnesha Hospital Desktop v$ver (Windows)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release with Desktop Installers
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.OHMS_RELEASE_TAG }}
          name: ${{ env.OHMS_RELEASE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            public/downloads/desktop/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest Desktop Binary Build Provenance
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
