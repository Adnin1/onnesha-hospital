name: OHMS 24-7 Autonomous System Health & Incident Monitor

on:
  schedule:
    # Run every 5 minutes 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat-monitor:
    name: 24/7 Autonomous Health Probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Execute 24/7 System Diagnostics & Invariant Probe
        run: node scripts/scheduled-health-check.mjs
        env:
          CANONICAL_URL: "https://onnesha-hospital.pages.dev"
          ORG_ID: "6b78e524-b1e3-4c43-8944-1a5a0248bff8"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
