server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enterprise Security Headers (mirrors public/_headers)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://securepay.sslcommerz.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://securepay.sslcommerz.com" always;

    # Gzip Compression for Fast Edge LAN Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets Caching (immutable hashed chunks)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # PWA Service Worker (fail-closed, must revalidate)
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Desktop Client Update Manifest
    location = /downloads/desktop/latest.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Private Hospital ERP Routes (no-store, noindex)
    location ^~ /app/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    # Auth & Security Routes
    location ~* ^/(login|mfa|forgot-password|reset-password|auth) {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    # Default SPA & Public HTML Routing Fallback
    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    # Custom 404 handler
    error_page 404 /_not-found.html;

    # Health Check Endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
