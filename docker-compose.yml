# ==============================================================================
# ONNESHA HOSPITAL MANAGEMENT SYSTEM (OHMS) — ENTERPRISE DOCKER COMPOSE
# Edge On-Premise LAN Web Delivery & Auxiliary Database Replica Topology
# NOTE: The authoritative backend is Supabase Cloud (iuhtzahuszdkdarhxobx.supabase.co).
# This auxiliary Compose stack provides containerized local web delivery and an optional
# internal PostgreSQL/Redis replica network. It does NOT replace Supabase Auth/Storage.
# ==============================================================================

services:
  # 1. Front-Facing Hospital Web Client & PWA (Hardened Nginx)
  ohms-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Error: NEXT_PUBLIC_SUPABASE_URL must be provided}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Error: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY must be provided}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://onnesha-hospital.pages.dev}
    container_name: ohms-web-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ohms-internal-network

  # 2. Local Edge PostgreSQL Database (Auxiliary Read Replica / Reporting Staging)
  # Isolated to internal network only — NO public host port exposure in production.
  ohms-postgres:
    image: postgres:16-alpine
    container_name: ohms-edge-db
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ohms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be provided via environment or secret file}
      POSTGRES_DB: ${POSTGRES_DB:-onnesha_hospital_db}
      TZ: Asia/Dhaka
    volumes:
      - ohms_postgres_data:/var/lib/postgresql/data
      - ./docker/init-db/init-postgres.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
      - ./docker/init-db:/docker-init-scripts:ro
      - ./supabase/migrations:/docker-migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ohms_admin} -d ${POSTGRES_DB:-onnesha_hospital_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ohms-internal-network

  # 3. High-Speed Cache & In-Memory Coordination (Redis)
  # Isolated to internal network only — NO public host port exposure in production.
  ohms-redis:
    image: redis:7-alpine
    container_name: ohms-edge-redis
    restart: unless-stopped
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Error: REDIS_PASSWORD must be provided via environment or secret file}
    command: >
      sh -c 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    volumes:
      - ohms_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ohms-internal-network

networks:
  ohms-internal-network:
    driver: bridge
    internal: false

volumes:
  ohms_postgres_data:
    driver: local
  ohms_redis_data:
    driver: local
